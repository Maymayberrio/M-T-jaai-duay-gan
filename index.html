<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f0f0f0;display:flex;justify-content:center;padding:20px;font-family:'Sarabun',sans-serif;}
.phone{background:#FFF8FB;width:300px;border-radius:30px;overflow:hidden;border:2px solid #F2E0EC;box-shadow:0 8px 28px rgba(200,120,160,.12);}
.hdr{background:linear-gradient(160deg,#FFD6E8 0%,#FFE8D6 50%,#D6E8FF 100%);padding:1rem 1rem 1.5rem;text-align:center;}
.hdr-emoji{font-size:26px;display:block;margin-bottom:3px;}
.hdr h1{font-size:16px;font-weight:700;color:#3D2535;}
.hdr-sub{font-size:11px;color:#8B6070;margin-top:2px;}
.wave{height:14px;background:#FFF8FB;border-radius:50% 50% 0 0/100% 100% 0 0;margin-top:-1px;}
.body{padding:.875rem;}
.status-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;}
.spill{display:inline-flex;align-items:center;gap:5px;background:#E6FAF5;border:1px solid #B5E8D8;border-radius:99px;padding:3px 10px;font-size:10px;color:#3A9E80;}
.dot{width:5px;height:5px;border-radius:50%;background:#3A9E80;}
.sum-box{border-radius:12px;padding:11px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.sum-pink{border:1.5px solid #F9A8C9;background:#FDE8F2;}
.sum-lav{border:1.5px solid #D4C5F9;background:#F0ECFF;}
.sum-lbl{font-size:10px;color:#9B607A;margin-bottom:2px;}
.sum-amt{font-size:17px;font-weight:800;color:#C4608A;}
.sum-amt-l{color:#6B50C4;}
.sum-emoji{font-size:20px;}
.sec-lbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:.5rem;display:flex;align-items:center;gap:5px;}
.sec-fam{color:#C4608A;}.sec-cafe{color:#C47020;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.875rem;}
.pc{background:white;border:1.5px solid #F2E0EC;border-radius:12px;padding:9px;position:relative;overflow:hidden;}
.pc::before{content:'';position:absolute;top:-8px;right:-8px;width:35px;height:35px;border-radius:50%;opacity:.3;}
.pc-pink::before{background:#F9A8C9;}.pc-lav::before{background:#D4C5F9;}
.pc-mint::before{background:#B5E8D8;}.pc-orange::before{background:#FFB347;}
.pc-emoji{font-size:16px;margin-bottom:2px;}
.pc-name{font-size:10px;font-weight:700;color:#3D2535;margin-bottom:1px;}
.pc-count{font-size:8px;color:#B89AAA;margin-bottom:3px;}
.pc-lbl{font-size:8px;color:#B89AAA;}
.pc-amt-p{font-size:12px;font-weight:800;color:#C4608A;}
.pc-amt-ok{font-size:12px;font-weight:800;color:#3A9E80;}
.pc-amt-o{font-size:12px;font-weight:800;color:#C47020;}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:none;border:1.5px dashed #F9A8C9;border-radius:12px;cursor:pointer;}
</style>
</head>
<body>
<div class="phone">
  <div class="hdr">
    <span class="hdr-emoji">🌸</span>
    <h1>จ่ายด้วยกันนะ</h1>
    <div class="hdr-sub">May & Turbo 💕</div>
  </div>
  <div class="wave"></div>
  <div class="body">
    <div class="status-row">
      <div class="spill"><div class="dot"></div>ซิงค์แล้ว 🌸</div>
      <span style="font-size:10px;color:#B89AAA;text-decoration:underline;">เปลี่ยน config</span>
    </div>
    <div class="sum-box sum-pink">
      <div><div class="sum-lbl">Turbo ต้องโอนให้ May</div><div class="sum-amt">฿500</div></div>
      <div class="sum-emoji">💸</div>
    </div>
    <div class="sum-box sum-lav">
      <div><div class="sum-lbl" style="color:#7B6AAA;">📅 เดือนนี้ใช้ไป</div><div class="sum-amt sum-amt-l">฿2,840</div></div>
      <div class="sum-emoji">📊</div>
    </div>
    <div class="sec-lbl sec-fam">🏠 ครอบครัว</div>
    <div class="grid">
      <div class="pc pc-pink"><div class="pc-emoji">🏖️</div><div class="pc-name">เที่ยวทะเล</div><div class="pc-count">8 รายการ</div><div class="pc-lbl">Turbo ต้องโอน</div><div class="pc-amt-p">฿320</div></div>
      <div class="pc pc-lav"><div class="pc-emoji">🏠</div><div class="pc-name">ค่าบ้าน</div><div class="pc-count">5 รายการ</div><div class="pc-lbl">เสมอกัน</div><div class="pc-amt-ok">฿0</div></div>
    </div>
    <div class="sec-lbl sec-cafe">☕ ร้านคาเฟ่</div>
    <div class="grid">
      <div class="pc pc-orange"><div class="pc-emoji">🧁</div><div class="pc-name">ค่าวัตถุดิบ</div><div class="pc-count">12 รายการ</div><div class="pc-lbl">รวม</div><div class="pc-amt-o">฿8,400</div></div>
      <div class="pc pc-mint"><div class="pc-emoji">🧾</div><div class="pc-name">ค่าน้ำค่าไฟ</div><div class="pc-count">3 รายการ</div><div class="pc-lbl">รวม</div><div class="pc-amt-o">฿2,100</div></div>
    </div>
    <button class="add-btn">
      <span style="font-size:16px;color:#F9A8C9;">+</span>
      <span style="font-size:12px;color:#C4608A;font-weight:700;">เพิ่มโปรเจค</span>
    </button>
  </div>
</div>
</body>
</html>
